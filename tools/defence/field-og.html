<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Field log share card</title>
<link href="https://fonts.googleapis.com/css2?family=Anybody:wdth,wght@50..150,400..900&amp;family=Azeret+Mono:wght@400;500;700&amp;display=block" rel="stylesheet">
<style>
html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:#241F1A;color:#EFE7DA}
.card{box-sizing:border-box;width:1200px;height:630px;padding:52px 64px;display:flex;flex-direction:column;border-top:10px solid #E2B26F}
.strip{display:flex;justify-content:space-between;font-family:"Azeret Mono",monospace;font-size:19px;letter-spacing:.08em;text-transform:uppercase;color:#A59A88;border-bottom:1px solid rgba(239,231,218,.16);padding-bottom:16px}
.strip b{color:#EFE7DA;font-weight:500}
h1{font-family:"Anybody",sans-serif;font-variation-settings:"wdth" 62;font-weight:850;font-size:92px;line-height:.88;margin:34px 0 0;letter-spacing:-.01em}
h1 span{display:block;color:#E2B26F}
.log{margin-top:auto;font-family:"Azeret Mono",monospace;font-size:20px;line-height:1.6;background:#2E2822;border:1px solid rgba(239,231,218,.16);border-radius:12px;padding:16px 22px}
.log div{display:grid;grid-template-columns:120px 1fr}
.log i{font-style:normal;color:#A59A88}
.log b{color:#E2B26F;font-weight:700}
</style>
</head>
<body>
<div class="card">
  <div class="strip"><span><b>Field log</b> / Pavel Guzhikov</span><span>guzh.uk/defence</span></div>
  <h1>You build the thing that flies. <span>I'll build the company that delivers it.</span></h1>
  <div class="log">
    <div><i>2005</i><span>Built a multi-channel mobile messenger.</span></div>
    <div><i>2 years</i><span>Uzum: millions of users, <b>1,000+ people</b>.</span></div>
    <div><i>2022</i><span>National payment infrastructure.</span></div>
  </div>
</div>
</body>
</html>
