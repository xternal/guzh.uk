<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Route share card</title>
<link href="https://fonts.googleapis.com/css2?family=Anybody:wdth,wght@50..150,400..900&amp;family=JetBrains+Mono:wght@400;600&amp;display=block" rel="stylesheet">
<style>
html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:#241F1A;color:#EFE7DA}
.card{position:relative;width:1200px;height:630px;padding:58px 64px;box-sizing:border-box}
.mono{font-family:"JetBrains Mono",monospace;font-size:17px;letter-spacing:.08em;text-transform:uppercase;color:#A59A88}
h1{font-family:"Anybody",sans-serif;font-weight:800;font-stretch:118%;font-size:66px;line-height:.95;letter-spacing:-.02em;margin:18px 0 0;max-width:760px}
h1 span{color:#E2B26F;display:block}
svg{position:absolute;inset:0}
.wp{font-family:"JetBrains Mono",monospace;font-size:15px;fill:#C0B5A4;letter-spacing:.04em}
.wp.big{fill:#E2B26F;font-weight:600}
.foot{position:absolute;left:64px;bottom:50px;font-family:"JetBrains Mono",monospace;font-size:18px;color:#C0B5A4;letter-spacing:.04em}
.foot b{color:#EFE7DA}
</style>
</head>
<body>
<div class="card">
  <svg width="1200" height="630" viewBox="0 0 1200 630">
    <path d="M880 70 C960 110 1020 120 1040 170 S960 250 980 300 S1100 360 1080 420 S960 470 1000 540" fill="none" stroke="#E2B26F" stroke-width="4" stroke-linecap="round"/>
    <path d="M1000 540 C1040 556 1080 560 1120 560" fill="none" stroke="#A59A88" stroke-width="2" stroke-dasharray="4 8"/>
    <g fill="#E2B26F"><circle cx="880" cy="70" r="8"/><circle cx="1040" cy="170" r="8"/><circle cx="980" cy="300" r="8"/><circle cx="1080" cy="420" r="8"/></g>
    <circle cx="1130" cy="560" r="10" fill="#241F1A" stroke="#E2B26F" stroke-width="3"/>
    <text class="wp" x="862" y="60" text-anchor="end">2005 messenger</text>
    <text class="wp" x="1058" y="175">2 exits</text>
    <text class="wp" x="960" y="305" text-anchor="end">unicorn, 1,000+ people</text>
    <text class="wp" x="1098" y="425">2022</text>
    <text class="wp big" x="1146" y="600" text-anchor="end">your next 18 months</text>
    <g transform="translate(1040 553) rotate(104) scale(1.8)"><path fill="#E2B26F" stroke="#241F1A" stroke-width=".8" d="M0-12C1.2-12 1.8-10 1.8-8V-3L11 2.5V5L1.8 2V7L4.5 9.5V11.5L0 10L-4.5 11.5V9.5L-1.8 7V2L-11 5V2.5L-1.8-3V-8C-1.8-10-1.2-12 0-12Z"/></g>
  </svg>
  <div class="mono">Defence and dual-use tech / Pavel Guzhikov</div>
  <h1>You build the thing that flies. <span>I'll build the company that delivers it.</span></h1>
  <div class="foot"><b>Delivery, product, scale, paperwork.</b> Hands-on. guzh.uk/defence</div>
</div>
</body>
</html>
