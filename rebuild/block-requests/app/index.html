html,body{margin:0;height:100%}

.me{display:flex;align-items:center;gap:8px;font-size:13px;white-space:nowrap}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--gold);color:var(--brand-2);display:grid;place-items:center;font-weight:700;font-size:12px}
.main{display:grid;grid-template-columns:220px minmax(360px,1fr) minmax(380px,460px);min-height:0}
.side{background:var(--panel);border-right:1px solid var(--line);padding:14px 10px;overflow:auto}
.side h4{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin:14px 8px 6px;font-weight:600}

.side button:hover{background:var(--line-2)}
.side button[aria-current="true"]{background:var(--brand-soft);color:var(--brand-2);font-weight:600}
.count{font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.count.hot{background:var(--red);color:#fff;border-radius:999px;padding:1px 7px}
.list{display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);background:var(--panel)}
.bar h2{font-size:16px;margin:0;font-weight:600}
.bar .sub{color:var(--ink-3);font-size:13px}
.btn{border:1px solid var(--brand);background:var(--brand);color:#fff;border-radius:8px;padding:8px 12px;font-weight:600;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.btn.ghost{background:#fff;color:var(--brand)}
.btn:disabled{opacity:.5;cursor:default}
.btn[aria-busy="true"]{opacity:1}
.spin{width:13px;height:13px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;display:none;animation:s .7s linear infinite}

.ml{margin-left:auto}
.rows{overflow:auto;flex:1}
.row{display:grid;grid-template-columns:10px 1fr auto;gap:4px 10px;padding:11px 14px;border-bottom:1px solid var(--line-2);background:var(--panel);cursor:pointer;border-left:3px solid transparent}
.row:hover{background:#FAFBFA}

.dot{width:9px;height:9px;border-radius:50%;margin-top:5px;background:#C9CFCC}
.dot.e{background:var(--red)}.dot.h{background:#E09B1A}.dot.n{background:#4E9A6F}.dot.r{background:var(--blue)}
.who{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.kv dt{color:var(--ink-3)}
.kv dd{margin:0}
.why{font-size:12.5px;color:var(--ink-3);margin-top:8px}
.disp{display:flex;align-items:center;gap:12px}
.disp .co{flex:1}
.disp .co b{display:block}
.disp .co span{color:var(--ink-3);font-size:12.5px}

.log li:last-child{border-bottom:0}

.empty{color:var(--ink-3);text-align:center;margin-top:30vh}
.toast{position:fixed;left:50%;bottom:44px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:11px 16px;border-radius:10px;font-size:13.5px;opacity:0;transition:.25s;pointer-events:none;width:max-content;max-width:min(560px,calc(100% - 32px));z-index:9}

.status{display:flex;flex-wrap:wrap;align-items:center;gap:4px 16px;padding:7px 16px;font-size:12px;color:var(--ink-3);background:var(--panel);border-top:1px solid var(--line)}

.status .r{margin-left:auto;display:flex;gap:14px}

  .detail{display:none;position:fixed;inset:56px 0 0 0;z-index:5}
  .app.open .detail{display:block}
  .back{display:inline-flex}
  .status .r a:first-child{display:none}
}
</style>

    var where = (t.flat ? "Flat " + t.flat + ", " : "") + (t.block || "your building");
    t.draft = "Dear " + t.from.split(" ")[0] + ",\n\n" + k.reply.replace("{where}", where).replace("{block}", t.block || "your building") +
      "\n\nYour reference is " + t.job + ".\n\nSam Morley\nNorthside Residential";
    t.log.push([t.time, "Triaged: " + k.label + ", " + URG[t.urg][0].toLowerCase() + (t.block ? ", " + t.block : "")]);
  }

  function visible() {
    var q = $("q").value.trim().toLowerCase();
    return T.filter(function (t) {
      if (t.state === "merged") return false;
      if (block && t.block !== block) return false;
      if (q && (t.from + " " + t.subj + " " + t.text + " " + (t.block || "") + " " + (t.job || t.id)).toLowerCase().indexOf(q) < 0) return false;
      if (view === "e") return t.urg === "e";
      if (view === "contractor") return t.state === "contractor";
      if (view === "resident") return t.state === "resident";
      if (view === "review") return t.urg === "r";
      if (view === "done") return t.state === "replied";
      return t.state !== "replied";
    }).sort(function (a, b) {
      var ua = a.urg ? URG[a.urg][2] : 4, ub = b.urg ? URG[b.urg][2] : 4;
      return (a.state === "new") - (b.state === "new") || ua - ub;
    });
  }

  function slaTag(t) {
    if (!t.urg || t.state === "replied") return "";
    var txt = t.urg === "e" ? "Respond now" : t.urg === "h" ? "Due today 17:00" : t.urg === "n" ? "Due Fri 20 Nov" : "Read today";
    return '<span class="tag ' + t.urg + '">' + txt + "</span>";
  }

  function rowHTML(t) {
    var k = t.kind && kindOf(t.kind);
    var tags = t.state === "new" ? "" : '<div class="tags">' + slaTag(t) + (k ? '<span class="tag cat">' + esc(k.label) + "</span>" : "") +
      (t.block ? '<span class="tag">' + esc(t.block + (t.flat ? ", Flat " + t.flat : "")) + "</span>" : "") +
      '<span class="tag">' + esc(STATE[t.state]) + "</span>" + (t.chasers ? '<span class="tag r">+' + t.chasers + " chaser</span>" : "") + "</div>";
    return '<div class="row" role="option" tabindex="0" data-id="' + t.id + '" aria-selected="' + (selected === t.id) + '">' +
      '<span class="dot ' + (t.state === "new" ? "" : t.urg || "") + '"></span><span class="who">' + esc(t.from) + (t.state === "new" ? '<span class="new">NEW</span>' : "") +
      '</span><span class="when">' + esc(t.job || t.id.replace("N-", "#")) + "  " + esc(t.time) + '</span><span class="subj">' + esc(t.subj) + "</span>" + tags + "</div>";
  }

  function render() {
    var v = visible();
    $("rows").innerHTML = v.length ? v.map(rowHTML).join("") : '<p class="empty">Nothing here.</p>';
    var fresh = T.filter(function (t) { return t.state === "new"; }).length;
    $("triageLabel").textContent = fresh ? "Triage " + fresh + " new" : "All triaged";
    $("triage").disabled = !fresh || $("triage").getAttribute("aria-busy") === "true";
    $("viewTitle").textContent = (block ? block + ": " : "") + VIEWS.filter(function (x) { return x[0] === view; })[0][1];
    $("viewSub").textContent = v.length + " request" + (v.length === 1 ? "" : "s");
    var counts = {
      inbox: T.filter(function (t) { return t.state !== "merged" && t.state !== "replied"; }).length,
      e: T.filter(function (t) { return t.urg === "e" && t.state !== "merged" && t.state !== "replied"; }).length,
      contractor: T.filter(function (t) { return t.state === "contractor"; }).length,
      resident: T.filter(function (t) { return t.state === "resident"; }).length,
      review: T.filter(function (t) { return t.urg === "r" && t.state !== "replied" && t.state !== "merged"; }).length,
      done: T.filter(function (t) { return t.state === "replied"; }).length
    };
    $("views").innerHTML = VIEWS.map(function (x) {
      return '<button type="button" data-view="' + x[0] + '" aria-current="' + (view === x[0] && !block) + '">' + x[1] +
        '<span class="count' + (x[0] === "e" && counts.e ? " hot" : "") + '">' + counts[x[0]] + "</span></button>";
    }).join("");
    $("blocks").innerHTML = BLOCKS.map(function (b) {
      var n = T.filter(function (t) { return t.block === b[0] && t.state !== "merged" && t.state !== "replied"; }).length;
      return '<button type="button" data-block="' + esc(b[0]) + '" aria-current="' + (block === b[0]) + '">' + esc(b[0]) + '<span class="count">' + n + " open</span></button>";
    }).join("");
    renderDetail();
  }

  function renderDetail() {
    var t = T.filter(function (x) { return x.id === selected; })[0];
    if (!t) { $("detail").innerHTML = '<p class="empty">Select a request.</p>'; return; }
    var k = t.kind && kindOf(t.kind);
    var h = '<button class="btn ghost back" type="button" id="back">Back</button>';
    h += '<div class="card dhead"><h1>' + esc(t.subj) + '</h1><div class="meta">' + esc(t.from) + ", " + esc(t.time) + (t.job ? ", " + t.job : "") + "</div></div>";
    h += '<div class="card"><h3>Email</h3><div class="mailbody">' + esc(t.text) + "</div></div>";
    if (t.state === "new") {
      h += '<div class="card"><h3>Triage</h3><p class="why">Not triaged yet. Press "Triage" to sort the new requests.</p></div>';
    } else {
      h += '<div class="card"><h3>Triage</h3><dl class="kv"><dt>Type</dt><dd>' + esc(k ? k.label : "Unclear") + "</dd><dt>Urgency</dt><dd>" + (t.urg ? '<span class="tag ' + t.urg + '">' + URG[t.urg][0] + "</span>" : "") +
        "</dd><dt>Block</dt><dd>" + esc(t.block || "Not found in the email") + "</dd><dt>Flat</dt><dd>" + esc(t.flat || "Not given") + "</dd><dt>Status</dt><dd>" + esc(STATE[t.state]) + "</dd></dl>" +
        (t.why ? '<p class="why">' + esc(t.why) + "</p>" : "") + "</div>";
      if (k && t.state !== "replied") {
        var booked = t.state === "contractor";
        h += '<div class="card"><h3>Dispatch</h3><div class="disp"><div class="co"><b>' + esc(k.who) + "</b><span>" + esc(k.note) + "</span></div>" +
          '<button class="btn' + (booked ? " ghost" : "") + '" type="button" id="dispatch"' + (booked ? " disabled" : "") + '><span class="spin" aria-hidden="true"></span><span>' + (booked ? "Booked" : k.note === "Internal" ? "Assign" : "Send job") + "</span></button></div></div>";
      }
      if (t.draft && t.state !== "replied") {
        h += '<div class="card"><h3>Reply to ' + esc(t.from) + '</h3><textarea id="draft" aria-label="Reply">' + esc(t.draft) + '</textarea><div class="actions"><button class="btn" type="button" id="send"><span class="spin" aria-hidden="true"></span><span>Send reply</span></button></div></div>';
      }
    }
    h += '<div class="card"><h3>Activity</h3><ul class="log">' + t.log.map(function (l) { return "<li><time>" + esc(l[0]) + "</time><span>" + esc(l[1]) + "</span></li>"; }).join("") + "</ul></div>";
    $("detail").innerHTML = h;
  }

  async function act(btn, ms, fn) {
    btn.setAttribute("aria-busy", "true"); btn.disabled = true;
    await wait(ms);
    fn(); render();
  }

  $("rows").addEventListener("click", function (e) {
    var r = e.target.closest(".row"); if (!r) return;
    selected = r.dataset.id; $("app").classList.add("open"); render();
  });
  $("rows").addEventListener("keydown", function (e) {
    if (e.key === "Enter") { var r = e.target.closest(".row"); if (r) { selected = r.dataset.id; $("app").classList.add("open"); render(); } }
  });
  $("views").addEventListener("click", function (e) { var b = e.target.closest("button"); if (b) { view = b.dataset.view; block = null; render(); } });
  $("blocks").addEventListener("click", function (e) { var b = e.target.closest("button"); if (b) { block = b.dataset.block; view = "inbox"; render(); } });
  $("q").addEventListener("input", render);
  $("detail").addEventListener("click", function (e) {
    var t = T.filter(function (x) { return x.id === selected; })[0];
    if (e.target.closest("#back")) { $("app").classList.remove("open"); return; }
    var d = e.target.closest("#dispatch");
    if (d && t) act(d, 700, function () { var k = kindOf(t.kind); t.state = "contractor"; t.log.push([now(), (k.note === "Internal" ? "Assigned to " : "Job sent to ") + k.who]); toast(t.job + " sent to " + k.who + "."); });
    var s = e.target.closest("#send");
    if (s && t) act(s, 700, function () { t.draft = $("draft").value; t.state = t.state === "contractor" ? "contractor" : "replied"; t.replied = true; t.log.push([now(), "Reply sent to " + t.from]); toast("Reply sent to " + t.from + "."); if (t.state === "contractor") { t.draft = null; } });
  });

  $("triage").addEventListener("click", async function () {
    var b = this, fresh = T.filter(function (t) { return t.state === "new"; }), t0 = performance.now();
    b.setAttribute("aria-busy", "true"); b.disabled = true; $("triageLabel").textContent = "Triaging";
    for (var i = 0; i < fresh.length; i++) {
      triageOne(fresh[i]);
      render();
      var el = document.querySelector('.row[data-id="' + (fresh[i].state === "merged" ? fresh[i].mergedId : fresh[i].id) + '"]');
      if (el) el.classList.add("flash");
      await wait(170);
    }
    var em = fresh.filter(function (t) { return t.urg === "e" && t.state !== "merged"; }).length,
        mg = fresh.filter(function (t) { return t.state === "merged"; }).length,
        rv = fresh.filter(function (t) { return t.urg === "r"; }).length;
    b.setAttribute("aria-busy", "false");
    if (!selected) selected = visible()[0] && visible()[0].id;
    render();
    toast(fresh.length + " emails triaged in " + ((performance.now() - t0) / 1000).toFixed(1) + " s: " + em + " emergencies first, " + mg + " chasers merged into open jobs, " + rv + " for a person to read.");
  });

  addEventListener("pageshow", function (e) { if (e.persisted) location.reload(); });
  selected = "N-1";
  render();
  /* #triaged opens the app with this morning's emails already sorted (used for the share image) */
  if (location.hash === "#triaged") $("triage").click();
})();
</script>
</body>
</html>
