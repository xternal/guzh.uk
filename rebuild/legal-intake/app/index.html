    var h = '<span class="b ink">' + esc(r.type ? r.type.label : "Unclear") + "</span>";
    h += r.conflicts.length ? '<span class="b red">Possible conflict</span>' : '<span class="b green">Clear across the group</span>';
    if (r.level > 1) h += '<span class="b ' + (r.level === 3 ? "red" : "amber") + '">AML: ' + (r.level === 3 ? "enhanced" : "source of funds") + "</span>";
    if (e.done) h += '<span class="b">' + esc(e.done) + "</span>";
    return h;
  }
  function list() {
    $("list").innerHTML = E.map(function (e) {
      var f = FIRMS[e.firm];
      return '<button class="item" type="button" data-id="' + e.id + '" aria-current="' + (sel === e) + '"><div class="t"><b>' + esc(e.from) + '</b><span class="w">' + e.time + '</span></div><span class="firm"><i style="background:' + f[2] + '"></i>' + esc(f[0]) + ", " + esc(e.via.toLowerCase()) +
        "</span><p>" + esc(e.text) + '</p><div class="badges">' + badges(e) + "</div></button>";
    }).join("");
    var left = E.filter(function (e) { return !e.r; }).length;
    $("n").textContent = E.length + " today";
    $("runLabel").textContent = left ? "Check all " + left : "All checked";
    if ($("runall").getAttribute("aria-busy") !== "true") $("runall").disabled = !left;
  }
  function letter(e, r) {
    var f = FIRMS[e.firm], first = r.company ? e.from : e.from.split(" ")[0];
    return '<div class="lh">' + esc(f[0]) + ", " + esc(f[1]) + "</div>" + esc("Dear " + first + ",\n\nThank you for asking " + f[0] + " to help with your " + (r.type ? r.type.label.toLowerCase() : "matter") + ". " +
      (r.type ? r.type.fe + " in our " + r.type.team + " team" : "A member of our team") + " will look after it.\n\nBefore we can start, please send us:\n" + r.docs.map(function (d) { return "    " + d; }).join("\n") +
      "\n\nOnce we have these, we will confirm the scope of our work and our estimate of costs in writing.\n\nYours sincerely,\n\n" + (r.type ? r.type.fe : "") + "\n" + f[0]);
  }
  function desk() {
    var e = sel;
    if (!e) { $("desk").innerHTML = '<p class="empty">Choose an enquiry on the left.</p>'; return; }
    var f = FIRMS[e.firm], r = e.r, h = '<button class="btn ghost back" id="back" type="button" style="margin-bottom:12px">All enquiries</button>';
    h += '<div class="dhead"><div><h2 class="serif">' + esc(e.from) + '</h2><div class="s"><span class="firm"><i style="background:' + f[2] + '"></i>' + esc(f[0]) + "</span>, " + esc(e.via.toLowerCase()) + " at " + e.time + "</div></div>";
    if (!r) h += '<button class="btn ml ai-cta" id="check" type="button"><span class="spin" aria-hidden="true"></span>' + SPARK + '<span>Run intake checks</span></button>';
    else if (r.dup) h += '<span class="b ml">Merged into the ' + esc(FIRMS[r.dup.firm][0]) + " enquiry at " + r.dup.time + "</span>";
    else if (!e.done) h += '<div class="actions ml">' + (r.conflicts.length ? '<button class="btn warn" type="button" data-act="Referred to risk"><span class="spin" aria-hidden="true"></span><span>Refer to risk team</span></button>' :
      '<button class="btn" type="button" data-act="Matter opened, letter sent"><span class="spin" aria-hidden="true"></span><span>Open matter and send letter</span></button>') + "</div>";
    else h += '<span class="b green ml">' + esc(e.done) + "</span>";
    h += "</div>";
    h += '<div class="box"><h3 class="serif">Enquiry</h3><p class="quote">' + esc(e.text) + "</p></div>";
    if (r && !r.dup) {
      h += '<div class="panes"><div>';
      h += '<div class="box"><h3 class="serif">Matter</h3><dl class="field"><dt>Type</dt><dd>' + esc(r.type ? r.type.label : "Unclear: a supervisor decides") + "</dd><dt>Team</dt><dd>" + esc(r.type ? r.type.team : "") + "</dd><dt>Fee earner</dt><dd>" + esc(r.type ? r.type.fe : "") +
        "</dd><dt>Client</dt><dd>" + esc(e.from) + (r.company ? " (company)" : " (individual)") + "</dd><dt>Firm</dt><dd>" + esc(f[0]) + "</dd></dl></div>";
      h += '<div class="box"><h3 class="serif">Anti-money laundering</h3><div class="meter l' + r.level + '"><i></i><i></i><i></i></div><b>' + esc(r.risk) + "</b>" +
        (r.watch.length ? '<p style="margin:8px 0 0;color:var(--red)">' + esc(r.watch.join(", ")) + " is on the screening list. MLRO approval needed before work starts.</p>" : "") +
        (r.gift ? '<p style="margin:8px 0 0;color:var(--ink-2)">Gifted deposit: the donors need to be identified and their funds evidenced.</p>' : "") +
        '<h3 class="serif" style="margin-top:16px">Documents to request</h3><ul class="docs">' + r.docs.map(function (d) { return "<li>" + esc(d) + "</li>"; }).join("") + "</ul></div>";
      h += '</div><div><div class="box"><h3 class="serif">Conflict search across the group</h3><table><thead><tr><th>Party</th><th>Found</th><th>Result</th></tr></thead><tbody>' + r.rows.map(function (x) {
        if (!x.rec) return "<tr><td>" + esc(x.party) + '</td><td style="color:var(--ink-3)">No record in 3 firms</td><td><span class="b green">Clear</span></td></tr>';
        var rf = FIRMS[x.rec[2]], res = x.kind === "conflict" ? '<span class="b red">Conflict</span>' : x.kind === "known" ? '<span class="b">Returning client</span>' : '<span class="b amber">Note</span>';
        var why = x.kind === "conflict" ? "We act or acted for them." : x.kind === "known" ? "" : x.rec[1] === "opponent" ? "Past opponent: acting against them again is fine." : "Past client: the original will may be held there.";
        return '<tr class="' + (x.kind === "conflict" ? "hit" : x.kind === "note" ? "note" : "") + '"><td>' + esc(x.party) + "</td><td>" + esc(x.rec[0]) + ", " + x.rec[1] + " of " + esc(rf[0]) + "<br><span style=\"color:var(--ink-3)\">" + esc(x.rec[3]) + ", " + x.rec[4] + "</span></td><td>" + res + (why ? '<div style="font-size:12.5px;color:var(--ink-3);margin-top:3px">' + why + "</div>" : "") + "</td></tr>";
      }).join("") + '</tbody></table><p style="font-size:12.5px;color:var(--ink-3);margin:10px 0 0">' + INDEX.length + " parties from Ashby &amp; Lowe, Hollins Partners and Marsh Gate Law searched at once.</p></div>";
      h += '<div class="box"><h3 class="serif">Client care letter</h3><div class="letter">' + letter(e, r) + "</div></div></div></div>";
    }
    $("desk").innerHTML = h;
  }
  function pick(e) { sel = e; $("app").classList.add("open"); list(); desk(); }
  async function run(e, btn) {
    if (btn) {
      btn.setAttribute("aria-busy", "true"); btn.disabled = true;
      for (var s of ["Reading the enquiry", "Searching 3 firms", "Rating AML risk", "Drafting the letter"]) { btn.lastElementChild.textContent = s; await wait(260); }
    }
    e.r = assess(e);
    await Agent.say(line(e), e.r.dup ? "info" : e.r.conflicts.length || e.r.level === 3 ? "bad" : e.r.level === 2 ? "warn" : "ok");
  }
  function line(e) {
    var r = e.r, f = FIRMS[e.firm][0];
    if (r.dup) return e.from + " wrote to " + f + " too. Merged into the " + FIRMS[r.dup.firm][0] + " enquiry.";
    var s = e.from + " (" + f + "): " + (r.type ? r.type.label.toLowerCase() : "unclear") + ". ";
    if (r.conflicts.length) { var rc = r.conflicts[0].rec; s += rc[0] + (rc[4] === "open" ? " is a current client of " + FIRMS[rc[2]][0] : " was a client of " + FIRMS[rc[2]][0] + " until " + rc[4].replace("closed ", "")) + ". Possible conflict."; }
    else s += "Clear across the group.";
    if (r.level === 3) s += " " + r.watch.join(", ") + " is on the screening list.";
    else if (r.level === 2) s += " Gifted deposit: source of funds needed.";
    return s;
  }

  $("list").addEventListener("click", function (ev) { var b = ev.target.closest(".item"); if (b) pick(E[+b.dataset.id]); });
  $("desk").addEventListener("click", async function (ev) {
    if (ev.target.closest("#back")) { $("app").classList.remove("open"); return; }
    var c = ev.target.closest("#check");
    if (c) { Agent.start("checking " + sel.from); await run(sel, c); Agent.done("waiting for you"); list(); desk(); return; }
    var a = ev.target.closest("[data-act]");
    if (a) { a.setAttribute("aria-busy", "true"); a.disabled = true; await wait(700); sel.done = a.dataset.act; list(); desk(); Agent.note(sel.from + ": " + sel.done.toLowerCase() + ".", "ok"); }
  });
  $("runall").addEventListener("click", async function () {
    var b = this, t0 = performance.now(), todo = E.filter(function (e) { return !e.r; });
    b.setAttribute("aria-busy", "true"); b.disabled = true;
    Agent.start("checking " + todo.length + " enquiries");
    await Agent.say("Searching " + INDEX.length + " parties held by Ashby & Lowe, Hollins Partners and Marsh Gate Law.", "go");
    for (var i = 0; i < todo.length; i++) { await run(todo[i]); list(); }
    b.setAttribute("aria-busy", "false"); list(); desk();
    var c = E.filter(function (e) { return e.r && e.r.conflicts.length && !e.r.dup; }).length, d = E.filter(function (e) { return e.r && e.r.dup; }).length, m = E.filter(function (e) { return e.r && e.r.level > 1 && !e.r.dup; }).length;
    await Agent.say(todo.length + " enquiries checked: " + c + " possible conflicts for the risk team, " + m + " need extra AML checks, " + d + " duplicate merged. Letters are drafted; nothing goes out until a fee earner opens the matter.", "go");
    Agent.done("waiting for you");
  });

  addEventListener("pageshow", function (e) { if (e.persisted) location.reload(); });
  list();
  if (matchMedia("(min-width: 901px)").matches) { sel = E[1]; list(); }
  desk();
  $("runall").insertAdjacentHTML("afterbegin", SPARK);
  Agent.init("Clerkwell");
  Tour.mount([
    { el: "#runall", title: "Start here", text: "The agent reads every new enquiry from all three firms, types the matter, checks every party against all the firms' client lists at once and drafts the client care letter." },
    { el: "#list", title: "One intake for the group", text: "Enquiries from Ashby & Lowe, Hollins Partners and Marsh Gate Law in one list, colour-coded by firm. Duplicates sent to two firms are merged." },
    { el: "#desk", title: "The matter, checked", text: "Each enquiry shows the conflict search across the group, the AML risk, the documents to ask for and the letter, ready to send." },
    { el: ".agent", title: "The agent", text: "It tells you what it found as it works. A fee earner opens the matter, and the risk team decides on every possible conflict." }
  ], "clerkwell", function () { agPulse("#runall"); });
  if (location.hash === "#ready") { $("runall").click(); }
})();
</script>
</body>
</html>
