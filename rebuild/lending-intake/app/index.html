th{color:var(--ink-3);font-weight:500;font-size:12px;position:sticky;top:0;background:#fff}
td.r,th.r{text-align:right}
.cat{font-size:11.5px;font-weight:600;padding:2px 7px;border-radius:5px;white-space:nowrap}

.c-debt{background:#FDE9E4;color:#9C3B22}.c-gam{background:var(--red-bg);color:var(--red)}.c-ret{background:var(--red-bg);color:var(--red)}.c-oth{background:var(--line-2);color:var(--ink-2)}
.tx{max-height:420px;overflow:auto}
.chk{display:grid;grid-template-columns:70px 1fr;gap:3px 12px;padding:10px 0;border-bottom:1px solid var(--line-2)}
.chk:last-child{border-bottom:0}
.chk .why{grid-column:2;color:var(--ink-3);font-size:13px}
textarea{width:100%;min-height:360px;border:1px solid var(--line);border-radius:10px;padding:14px;font:13px/1.55 "IBM Plex Mono",ui-monospace,Menlo,monospace;color:var(--ink);resize:vertical;background:#FCFCFE}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.hint{color:var(--ink-3);text-align:center;padding:60px 20px}
.toast{position:fixed;left:50%;bottom:44px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:11px 16px;border-radius:10px;font-size:13.5px;opacity:0;transition:.25s;pointer-events:none;width:max-content;max-width:min(560px,calc(100% - 32px));z-index:9}
.toast.on{opacity:1;transform:translateX(-50%)}
.status{display:flex;flex-wrap:wrap;gap:4px 16px;align-items:center;padding:7px 20px;font-size:12px;color:var(--ink-3);background:#fff;border-top:1px solid var(--line)}
.status a{color:var(--ink-2)}
.status .r{margin-left:auto;display:flex;gap:14px}
.back{display:none}
@media (max-width:900px){
  .tabs,.lender{display:none}
  .main{grid-template-columns:1fr}
  .work{display:none;padding:16px}
  .app.open .work{display:block}
  .app.open .queue{display:none}
  .back{display:inline-flex}
  .kv{grid-template-columns:120px 1fr}
}

    var L = ["CREDIT MEMO", "", "Applicant   " + a.name, "Sector      " + a.sector, "Request     " + gbp(a.app.amount) + " over " + a.app.term + " months", "Purpose     " + a.app.purpose,
      "Repayment   " + gbp(f.pay) + " a month at " + Math.round(RATE * 100) + "% a year", "Introducer  " + a.broker, "",
      "TRADING (Aug to Oct 2026)", "Credits     " + gbp(f.credits) + " a month", "Debits      " + gbp(f.debits) + " a month", "Debt now    " + gbp(f.debt) + " a month",
      "Free cash   " + gbp(f.free) + " a month before debt", "Cover       " + f.dscr.toFixed(2) + "x with the new loan", "Closing     " + gbp(f.closing), "", "POLICY"];
    list.forEach(function (c) { L.push((c.state.toUpperCase() + "     ").slice(0, 7) + c.name + ". " + c.why); });
    var asks = list.filter(function (c) { return c.state !== "pass"; });
    if (asks.length) { L.push("", "FOR THE UNDERWRITER"); asks.forEach(function (c) { L.push("- " + c.name + ": " + c.why); }); }
    L.push("", "RECOMMENDATION  " + v[0].toUpperCase(), "", "Prepared by Keelson for Rachel Ibe, senior underwriter.");
    return L.join("\n");
  }

  function balanceChart(f) {
    var W = 640, H = 200, P = 34, d = f.daily, min = Math.min(0, Math.min.apply(null, d)), max = Math.max.apply(null, d) * 1.1;
    var x = function (i) { return P + i * (W - P - 8) / (d.length - 1); }, y = function (v) { return 10 + (max - v) * (H - 34) / (max - min || 1); };
    var pts = d.map(function (v, i) { return x(i).toFixed(1) + "," + y(v).toFixed(1); }).join(" ");
    var area = "M" + x(0) + "," + y(0) + " L" + pts.split(" ").join(" L") + " L" + x(d.length - 1) + "," + y(0) + " Z";
    var s = '<svg class="chart" viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="Daily balance, August to October">';
    [max, (max + min) / 2, min].forEach(function (v) { s += '<line x1="' + P + '" x2="' + (W - 8) + '" y1="' + y(v) + '" y2="' + y(v) + '" stroke="#ECEBF3"/><text x="' + (P - 6) + '" y="' + (y(v) + 4) + '" font-size="10" text-anchor="end" fill="#6D6C84">' + k(v) + "</text>"; });
    if (min < 0) s += '<line x1="' + P + '" x2="' + (W - 8) + '" y1="' + y(0) + '" y2="' + y(0) + '" stroke="#B42318" stroke-dasharray="4 3"/>';
    s += '<path d="' + area + '" fill="#3B2F8F" opacity=".08"/><polyline points="' + pts + '" fill="none" stroke="#3B2F8F" stroke-width="2"/>';
    [0, 31, 61].forEach(function (i, mi) { s += '<text x="' + x(i) + '" y="' + (H - 6) + '" font-size="10" fill="#6D6C84">' + MONTHS[mi][0] + "</text>"; });
    return s + "</svg>";
  }
  function flowChart(f) {
    var W = 320, H = 200, max = Math.max.apply(null, f.monthly.map(function (m) { return Math.max(m[0], m[1]); })) * 1.1, s = '<svg class="chart" viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="Monthly money in and out">';
    f.monthly.forEach(function (m, i) {
      var x0 = 30 + i * 96, hIn = m[0] / max * 150, hOut = m[1] / max * 150;
      s += '<rect x="' + x0 + '" y="' + (170 - hIn) + '" width="30" height="' + hIn + '" rx="3" fill="#1F8A7E"/><rect x="' + (x0 + 34) + '" y="' + (170 - hOut) + '" width="30" height="' + hOut + '" rx="3" fill="#B9B4E0"/>';
      s += '<text x="' + (x0 + 32) + '" y="190" font-size="11" text-anchor="middle" fill="#6D6C84">' + MONTHS[i][0] + '</text><text x="' + (x0 + 15) + '" y="' + (164 - hIn) + '" font-size="9.5" text-anchor="middle" fill="#14675E">' + k(m[0]) + "</text>";
    });
    return s + '<line x1="20" x2="310" y1="170" y2="170" stroke="#DAD8E8"/></svg><div class="legend"><span><i style="background:#1F8A7E"></i>Money in</span><span><i style="background:#B9B4E0"></i>Money out</span></div>';
  }

  function queue() {
    $("queue").innerHTML = APPS.map(function (a) {
      var st = a.decided ? '<span class="pill ' + a.decided[1] + '">' + a.decided[0] + "</span>" : a.result ? '<span class="pill ' + a.result[1] + '">Suggests ' + a.result[0].toLowerCase() + "</span>" : '<span class="pill new">New</span>';
      return '<button class="qitem" type="button" data-key="' + a.key + '" aria-current="' + (current === a) + '"><b>' + esc(a.name) + '</b><span class="amt num">' + gbp(a.app.amount) +
        '</span><span class="s">' + esc(a.broker) + ", " + a.received + "</span>" + st + "</button>";
    }).join("") + DONE.map(function (d) {
      return '<div class="qitem" aria-disabled="true" style="cursor:default"><b>' + esc(d[0]) + '</b><span class="amt num">' + gbp(d[1]) + '</span><span class="s">Decided ' + d[2] + '</span><span class="pill ' + d[4] + '">' + d[3] + "</span></div>";
    }).join("");
    $("qcount").textContent = APPS.filter(function (a) { return !a.decided; }).length + " to decide";
  }

  function work() {
    var a = current;
    if (!a) { $("work").innerHTML = '<p class="hint">Pick an application from the queue.</p>'; return; }
    var r = a.result, h = '<button class="btn ghost back" id="back" type="button" style="margin-bottom:12px">Back to the queue</button>';
    h += '<div class="whead"><div><h1>' + esc(a.name) + '</h1><div class="s">' + gbp(a.app.amount) + " over " + a.app.term + " months, " + esc(a.app.purpose.toLowerCase()) + "</div></div>";
    h += r ? '<span class="pill ' + r[1] + '" style="font-size:13px;padding:4px 12px">Keelson suggests: ' + r[0] + "</span>" : '<button class="btn ml ai-cta" id="analyse" type="button"><span class="spin" aria-hidden="true"></span>' + SPARK + '<span>Analyse the pack</span></button>';
    h += "</div>";
    h += '<div class="subtabs" role="tablist">' + [["overview", "Overview"], ["statements", "Statements"], ["checks", "Policy checks"], ["memo", "Credit memo"]].map(function (t) {
      return '<button type="button" role="tab" data-tab="' + t[0] + '" aria-selected="' + (tab === t[0]) + '"' + (!r && t[0] !== "overview" ? " disabled" : "") + ">" + t[1] + "</button>";
    }).join("") + "</div>";
    if (tab === "overview" || !r) {
      if (r) {
        var f = a.f;
        h += '<div class="kpis"><div class="kpi"><span>Credits a month</span><b class="num">' + gbp(f.credits) + '</b></div><div class="kpi"><span>Free cash before debt</span><b class="num">' + gbp(f.free) +
          '</b></div><div class="kpi"><span>New payment</span><b class="num">' + gbp(f.pay) + '</b></div><div class="kpi ' + (f.dscr >= 1.25 ? "ok" : f.dscr >= 1 ? "ref" : "no") + '"><span>Debt service cover</span><b class="num">' + f.dscr.toFixed(2) + "x</b></div></div>";
        h += '<div class="grid" style="grid-template-columns:2fr 1fr;margin-bottom:14px"><div class="card"><h3>Daily balance</h3>' + balanceChart(f) + '</div><div class="card"><h3>Money in and out</h3>' + flowChart(f) + "</div></div>";
      }
      h += '<div class="grid"><div class="card"><h3>Application</h3><dl class="kv"><dt>Director applying</dt><dd>' + esc(a.app.director) + "</dd><dt>Years trading</dt><dd>" + a.app.years.toFixed(1) +
        "</dd><dt>Stated turnover</dt><dd class=\"num\">" + gbp(a.app.turnover) + "</dd><dt>Sector</dt><dd>" + esc(a.sector) + "</dd><dt>Introducer</dt><dd>" + esc(a.broker) + "</dd></dl></div>";
      h += '<div class="card"><h3>Registry</h3><dl class="kv"><dt>Status</dt><dd>' + a.reg.status + "</dd><dt>Incorporated</dt><dd>" + a.reg.incorporated + "</dd><dt>Directors</dt><dd>" + esc(a.reg.directors.join(", ")) +
        "</dd><dt>CCJs</dt><dd>" + a.reg.ccjs + "</dd><dt>Filings</dt><dd>" + a.reg.filings + "</dd></dl></div>";
      h += '<div class="card"><h3>Documents received</h3><dl class="kv"><dt>Application form</dt><dd>PDF, 4 pages</dd><dt>Bank statements</dt><dd>3 months, ' + a.tx.length + " lines</dd><dt>Filed accounts</dt><dd>" + (a.reg.filings === "Up to date" ? "Latest year" : "Missing") + "</dd><dt>ID</dt><dd>Director passport</dd></dl></div></div>";
    } else if (tab === "statements") {
      h += '<div class="card"><h3>Transactions, categorised</h3><div class="tx"><table><thead><tr><th>Date</th><th>Description</th><th>Category</th><th class="r">Amount</th><th class="r">Balance</th></tr></thead><tbody>' +
        a.tx.map(function (t) { var c = CATS[t.cat]; return "<tr><td>" + t.day + " " + MONTHS[t.m][0] + "</td><td class=\"mono\">" + esc(t.desc) + '</td><td><span class="cat ' + c[1] + '">' + c[0] + '</span></td><td class="r num">' + (t.amt ? gbp(t.amt) : "returned") + '</td><td class="r num">' + gbp(t.bal) + "</td></tr>"; }).join("") +
        "</tbody></table></div></div>";
    } else if (tab === "checks") {
      h += '<div class="card"><h3>Brookmere credit policy, v4</h3>' + a.checks.map(function (c) {
        var cl = c.state === "pass" ? "ok" : c.state === "refer" ? "ref" : "no";
        return '<div class="chk"><span class="pill ' + cl + '" style="justify-self:start">' + c.state + "</span><b>" + esc(c.name) + '</b><span class="why">' + esc(c.why) + "</span></div>";
      }).join("") + "</div>";
    } else if (tab === "memo") {
      h += '<div class="card"><h3>Draft credit memo</h3><textarea id="memo" aria-label="Credit memo">' + esc(a.memo) + "</textarea>";
      h += a.decided ? '<p style="margin:12px 0 0">Decision recorded: <span class="pill ' + a.decided[1] + '">' + a.decided[0] + "</span></p>" :
        '<div class="actions"><button class="btn teal" type="button" data-decide="Approved|ok"><span class="spin" aria-hidden="true"></span><span>Approve</span></button><button class="btn warn" type="button" data-decide="Referred|ref"><span class="spin" aria-hidden="true"></span><span>Refer to credit committee</span></button><button class="btn bad" type="button" data-decide="Declined|no"><span class="spin" aria-hidden="true"></span><span>Decline</span></button></div>';
      h += "</div>";
    }
    $("work").innerHTML = h;
  }

  function open(a) { current = a; if (!a.tx) a.tx = statements(a); tab = "overview"; $("app").classList.add("open"); queue(); work(); }

  $("queue").addEventListener("click", function (e) { var b = e.target.closest("button.qitem"); if (b) open(APPS.filter(function (a) { return a.key === b.dataset.key; })[0]); });
  $("work").addEventListener("click", async function (e) {
    if (e.target.closest("#back")) { $("app").classList.remove("open"); return; }
    var t = e.target.closest("[data-tab]"); if (t && !t.disabled) { tab = t.dataset.tab; work(); return; }
    var an = e.target.closest("#analyse");
    if (an) {
      an.setAttribute("aria-busy", "true"); an.disabled = true;
      var a = current, f = analyse(a, a.tx), cks = checks(a, f), v = verdict(cks);
      an.lastElementChild.textContent = "Working";
      Agent.start("analysing " + a.name);
      await Agent.say("Reading the application: " + gbp(a.app.amount) + " over " + a.app.term + " months for " + a.app.purpose.toLowerCase() + ".", "go");
      await Agent.say("Registry: " + a.reg.status.toLowerCase() + ", directors " + a.reg.directors.join(" and ") + ". " + (a.reg.directors.indexOf(a.app.director) >= 0 ? a.app.director + " matches." : a.app.director + " is not a director."), a.reg.directors.indexOf(a.app.director) >= 0 ? "ok" : "bad");
      await Agent.say("Categorised " + a.tx.length + " statement lines: revenue " + gbp(f.credits) + " a month, debt service " + gbp(f.debt) + ".", "ok");
      for (var ci = 0; ci < cks.length; ci++) if (cks[ci].state !== "pass" && cks[ci].name.indexOf("Debt service") < 0) await Agent.say(cks[ci].name + ": " + cks[ci].why, cks[ci].state === "fail" ? "bad" : "warn");
      await Agent.say("Affordability: free cash " + gbp(f.free) + " a month, cover " + f.dscr.toFixed(2) + "x with the new loan.", f.dscr >= 1.25 ? "ok" : "warn");
      await Agent.say("Suggestion: " + v[0].toLowerCase() + ". The memo is drafted; the decision is yours.", "go");
      Agent.done("memo ready for you");
      a.f = f; a.checks = cks; a.result = v; a.memo = memo(a, f, cks, v);
      queue(); work();
      return;
    }
    var d = e.target.closest("[data-decide]");
    if (d) {
      d.setAttribute("aria-busy", "true"); document.querySelectorAll("[data-decide]").forEach(function (b) { b.disabled = true; });
      await wait(700);
      current.memo = $("memo").value; current.decided = d.dataset.decide.split("|"); queue(); work();
      Agent.note(current.name + ": " + current.decided[0].toLowerCase() + " by Rachel Ibe. Memo filed; the broker is told.", current.decided[1] === "ok" ? "ok" : current.decided[1] === "ref" ? "warn" : "bad");
    }
  });

  addEventListener("pageshow", function (e) { if (e.persisted) location.reload(); });
  queue();
  if (matchMedia("(min-width: 901px)").matches) open(APPS[1]); else { $("work").innerHTML = ""; }
  Agent.init("Keelson");
  Tour.mount([
    { el: ".queue", title: "Today's applications", text: "New packs from brokers and direct applicants land here. Decided ones stay below for reference." },
    { el: "#analyse", title: "Start here", text: "The agent reads the application and three months of bank statements, checks the registry, applies your credit policy and drafts the memo." },
    { el: ".subtabs", title: "Everything it found", text: "Charts of the balance and cash flow, every transaction categorised, each policy check with its reason, and the memo." },
    { el: ".agent", title: "The agent", text: "It tells you what it found as it works. The decision, approve, refer or decline, is always the underwriter's." }
  ], "keelson", function () { agPulse("#analyse"); });
  if (location.hash === "#ready") { open(APPS[1]); $("analyse").click(); }
})();
</script>
</body>
</html>
